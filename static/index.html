<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spot | Mastercard workspace</title>
  <link rel="icon" href="/static/icons/chat_multiple_24_regular.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/teams.css">
</head>
<body>
  <nav class="rail" aria-label="Apps">
    <div class="rail-logo" title="Workspace">
      <span class="ic" style="--i:url(/static/icons/chat_multiple_24_regular.svg)"></span>
    </div>
    <button class="rail-item" data-view="activity">
      <span class="ic" style="--i:url(/static/icons/alert_24_regular.svg)"></span><span>Activity</span>
      <b class="badge hidden" id="activity-badge"></b>
    </button>
    <button class="rail-item" data-view="chat">
      <span class="ic" style="--i:url(/static/icons/chat_24_regular.svg)"></span><span>Chat</span>
    </button>
    <button class="rail-item on" data-view="teams">
      <span class="ic" style="--i:url(/static/icons/people_team_24_regular.svg)"></span><span>Teams</span>
    </button>
    <button class="rail-item" data-view="spot">
      <span class="rail-spot" id="rail-spot"></span><span>Spot</span>
    </button>
  </nav>

  <div class="main">
    <header class="titlebar">
      <div class="org" id="org"></div>
      <label class="tb-search">
        <span class="ic" style="--i:url(/static/icons/search_20_regular.svg)"></span>
        <input placeholder="Search" aria-label="Search">
      </label>
      <div class="tb-right">
        <label class="signed-in">Signed in as
          <select id="user-select" aria-label="Signed in as"></select>
        </label>
        <button class="btn" id="reset">Reset demo</button>
        <div id="me-avatar"></div>
      </div>
    </header>

    <div class="body">
      <aside class="list">
        <div class="list-scroll" id="list"></div>
        <div class="demo-note">Demo data: fictional people and conversations</div>
      </aside>

      <section class="panel">
        <div class="head" id="head"></div>
        <div class="feed" id="feed"></div>
        <div class="composer" id="composer">
          <div class="popup hidden" id="popup" role="listbox"></div>
          <div class="replying hidden" id="replying"></div>
          <div class="compose-box">
            <textarea id="compose" rows="1" placeholder="Start a post"></textarea>
            <div class="compose-icons">
              <span class="ic" style="--i:url(/static/icons/text_font_20_regular.svg)"></span>
              <span class="ic" style="--i:url(/static/icons/emoji_20_regular.svg)"></span>
              <span class="ic" style="--i:url(/static/icons/attach_20_regular.svg)"></span>
              <button class="send" id="send" aria-label="Send"><span class="ic" style="--i:url(/static/icons/send_24_filled.svg)"></span></button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <!--DEMO_DEFAULT_USER-->
  <script src="/static/vendor/adaptivecards.min.js"></script>
  <script src="/static/spot.js"></script>
</body>
</html>
